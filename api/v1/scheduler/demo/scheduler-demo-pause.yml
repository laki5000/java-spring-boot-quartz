post:
  tags: [scheduler-demo]
  operationId: pauseSchedule
  summary: Pause a schedule

  parameters:
    - name: scheduleId
      in: path
      required: true
      schema:
        type: string

  responses:
    '204':
      description: Schedule paused successfully

    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/api-error-response.yml'
name: Unit Tests

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: backend-build
          path: backend/target

      - name: Run unit tests
        working-directory: backend
        run: mvn jacoco:prepare-agent surefire:test -Punit-tests

      - name: Upload JaCoCo execution data
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-jacoco
          path: backend/target/jacoco.exec